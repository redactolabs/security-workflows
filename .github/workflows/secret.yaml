# .github/workflows/secrets.yaml
# -----------------------------------------------------------------------------
# Redacto secret-scanning stub. Calls the centralized reusable gitleaks workflow
# in redactolabs/security-workflows. Keep this file THIN — scan logic, full-history
# fetch, baseline handling and Slack formatting all live in the reusable workflow.
#
# Per-repo tuning lives in two files at the repo ROOT, not here:
#   .gitleaks.toml           -> allowlist of false-positive CLASSES
#   .gitleaks-baseline.json  -> accepted legacy findings (added AFTER rotation)
#
# This stub is identical across repos (staging/main are universal). The only
# per-repo difference is the .gitleaks.toml. Copy as-is to other consumer repos.
# -----------------------------------------------------------------------------
name: secret scan

on:
  # Scan a branch when a PR TARGETS staging or main — catches secrets at the gate,
  # before they merge into a protected branch. This trigger is also what lets you
  # make the scan a REQUIRED status check later (a required check must run on the PR).
  pull_request:
    branches: [staging, main]

  # Safety net for direct pushes to the protected branches.
  push:
    branches: [staging, main]

  # Manual run from the Actions tab (handy for re-testing after committing .gitleaks.toml).
  workflow_dispatch:

# Least privilege: the scan only needs to read the repo.
permissions:
  contents: read

jobs:
  gitleaks:
    # Pinned to @v1. If you've cut a v2 of the reusable workflow (e.g. the Node 24
    # checkout@v5 bump), change this tag accordingly.
    uses: redactolabs/security-workflows/.github/workflows/gitleaks.yml@v1
    secrets:
      # Reuses the existing org-level Dependabot webhook (same Slack channel).
      # The reusable workflow declares this input as SLACK_WEBHOOK_URL.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPENDABOT_WEBHOOK_URL_TEST }}
